<style>
:root{
  /* Break Leve · Sol & Menta. Layout: coluna única de celular, cartões grandes para o polegar */
  --ink:#13293D; --ink-2:#1C3A55; --cream:#FFF8EC; --sun:#FFB020; --sun-soft:#FFC95C; --sun-text:#A86400; --mint:#3DD9A0; --line:#EADFC9; --muted:#5A6B7A;
  --f-brand:'Space Grotesk', 'Segoe UI', sans-serif; --f-display:'Nunito', 'Segoe UI', sans-serif; --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{background:var(--ink);color:var(--cream);padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-brand);font-size:26px;letter-spacing:-.5px;line-height:1}
.brand b{font-weight:700}.brand span{color:var(--sun-soft)}
.company{font-size:13px;color:#B8C7D6;text-align:right;line-height:1.3}
.company strong{display:block;color:var(--cream);font-weight:600;font-size:14px}
.anchor{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.anchor em{font-style:normal;color:var(--sun-soft)}
.streak{display:flex;align-items:center;gap:8px;font-size:13px;color:#DCE6EF}
.streak .dot{width:8px;height:8px;border-radius:4px;background:var(--mint)}
main{flex:1;padding:20px 16px 32px;display:flex;flex-direction:column;gap:26px}
h2.sec{font-family:var(--f-brand);font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-.2px}
.month{background:var(--sun);color:var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:none;text-align:left;width:100%}
.month small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.month .t{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.05}
.month .d{font-size:14px}
.month .go{align-self:flex-start;background:var(--ink);color:var(--cream);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.time{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:96px;border-top:6px solid var(--mint)}
.time:nth-child(2){border-top-color:var(--sun)}.time:nth-child(3){border-top-color:var(--ink)}
.time .n{font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.1}
.time .m{font-family:var(--f-brand);font-weight:700;color:var(--sun-text);font-size:15px}
.feels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:600;font-size:15px;line-height:1.25;min-height:64px}
.feel svg{flex:none}
.libbtn{width:100%;background:transparent;border:2px dashed var(--line);border-radius:16px;padding:14px;font-weight:600;color:var(--muted)}
footer.foot{padding:18px 16px 28px;text-align:center;font-size:12px;color:var(--muted)}
/* telas internas */
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);color:var(--cream)}
.back{background:transparent;border:none;color:var(--cream);font-size:15px;font-weight:600;padding:8px 4px;display:flex;align-items:center;gap:6px}
.bar .ttl{font-family:var(--f-brand);font-weight:700;font-size:17px}
.list{display:flex;flex-direction:column;gap:12px}
.combo{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.combo .k{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.pill{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.p-respiro{background:#D7F7EA;color:#11634A}.p-ajuste{background:#FFE9BF;color:#7A4A00}.p-recarga{background:#DCE4EE;color:var(--ink)}.p-mes{background:var(--sun);color:var(--ink)}
.combo .t{font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.15}
.combo .s{font-size:14px;color:var(--muted)}
.note{background:#fff;border-left:4px solid var(--sun);border-radius:10px;padding:12px 14px;font-size:14px}
/* player */
.player{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 16px 24px}
.stepinfo{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.video{height:min(44vh,440px);background:var(--ink);border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.video video{height:100%;width:100%;object-fit:contain;display:block}
.libitem{display:flex;gap:12px;align-items:flex-start}
.libitem img{width:56px;height:100px;object-fit:cover;border-radius:10px;flex:0 0 56px;background:var(--line)}
.video .tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.12);color:var(--cream);border-radius:999px;padding:4px 10px;font-size:12px}
.figure{animation:stretch 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes stretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
@media (prefers-reduced-motion: reduce){.figure{animation:none}.progress i{transition:none}}
.exname{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.how{margin:0;font-size:16px}
.dose{font-size:14px;font-weight:600;color:var(--sun-text)}
.timer{display:flex;align-items:center;justify-content:center;gap:18px}
.clock{font-family:var(--f-brand);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.btn{border:none;border-radius:16px;padding:16px 10px;font-weight:600;font-size:16px;min-height:56px}
.btn.main{background:var(--ink);color:var(--cream)}
.btn.soft{background:#fff;border:1px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);width:100%}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px 20px}
.done h2{font-family:var(--f-display);font-weight:900;font-size:30px;margin:0;line-height:1.1}
.done p{margin:0;max-width:32ch}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;background:#fff}
.lib{display:flex;flex-direction:column;gap:8px}
.libitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.libitem .t{font-weight:600}.libitem .s{font-size:13px;color:var(--muted)}
.libitem p{margin:6px 0 0;font-size:14px}
.hidden{display:none !important}
</style>

<script>

const MES = { nome: "Novembro", tema: "Força que protege", desc: "Fortalecimento geral para proteger costas, ombros e joelhos.", combo: "mes-ajuste" };

const EX = {

function weekCount(){
  try{
    const d = JSON.parse(localStorage.getItem("bl_pausas")||"[]");
    const wk = Date.now() - 7*864e5;
    return d.filter(t=>t>wk).length;
  }catch(e){return null}
}
function addPause(){
  try{
    const d = JSON.parse(localStorage.getItem("bl_pausas")||"[]");
    d.push(Date.now()); localStorage.setItem("bl_pausas", JSON.stringify(d.slice(-200)));
  }catch(e){}
}

let timer = null;
function stopTimer(){ if(timer){clearInterval(timer); timer=null;} }

function home(){
  stopTimer();
  const n = weekCount();
  app.innerHTML = `
  <header class="top">
    <div class="brandrow">
      <div class="brand">${LOGO(36)}<div><b>break</b><span>leve</span></div></div>
      <div class="company">Programa de pausas<strong>${EMPRESA}</strong></div>
    </div>
    <p class="anchor">Cuidar de você <em>faz parte do trabalho.</em></p>
    ${n!==null ? `<div class="streak"><span class="dot"></span>${n===0?"Sua primeira pausa da semana começa aqui.":`Você fez ${n} ${n===1?"pausa":"pausas"} nos últimos 7 dias.`}</div>`:""}
  </header>
  <main>
    <button class="month" id="mes">
      <small>Tema de ${MES.nome}</small>
      <span class="t">${MES.tema}</span>
      <span class="d">${MES.desc}</span>
      <span class="go">Fazer o Ajuste do mês · 5 min</span>
    </button>
    <section>
      <h2 class="sec">Quanto tempo você tem?</h2>
      <div class="times">
        <button class="time" data-k="respiro"><span class="n">Respiro</span><span class="m">1 min</span></button>
        <button class="time" data-k="ajuste"><span class="n">Ajuste</span><span class="m">5 min</span></button>
        <button class="time" data-k="recarga"><span class="n">Recarga</span><span class="m">15 min</span></button>
      </div>
    </section>
    <section>
      <h2 class="sec">O que você está sentindo?</h2>
      <div class="feels">
        ${Object.keys(CATS).map(c=>`<button class="feel" data-c="${c}">${icon(c)}<span>${CATS[c]}</span></button>`).join("")}
      </div>
    </section>
    <button class="libbtn" id="lib">Ver todos os exercícios</button>
  </main>
  <footer class="foot">Break Leve · pausas ativas para empresas</footer>`;
  document.getElementById("mes").onclick = () => intro(COMBOS.find(c=>c.id===MES.combo), home);
  document.querySelectorAll(".time").forEach(b=>b.onclick=()=>listByKind(b.dataset.k));
  document.querySelectorAll(".feel").forEach(b=>b.onclick=()=>listByCat(b.dataset.c));
  document.getElementById("lib").onclick = library;
  window.scrollTo(0,0);
}

function bar(title, back){
  return `<div class="bar"><button class="back" id="back" aria-label="Voltar">‹ Voltar</button><span class="ttl">${title}</span></div>`;
}
function comboCard(c){
  const [k,,cls] = KIND[c.k];
  return `<button class="combo" data-id="${c.id}">
    <span class="k"><span class="pill ${cls}">${k} · ${mins(c)}</span>${c.c && CATS[c.c] ? CATS[c.c] : ""}</span>
    <span class="t">${c.t}</span>
    <span class="s">${c.s.map(x=>EX[x[0]].n).join(" · ")}</span>
  </button>`;
}
function bindCombos(back){
  document.querySelectorAll(".combo").forEach(b=>b.onclick=()=>intro(COMBOS.find(c=>c.id===b.dataset.id), back));
}

function listByKind(k){
  stopTimer();
  const items = COMBOS.filter(c=>c.k===k);
  const [name,dur] = KIND[k];
  app.innerHTML = bar(`${name} · ${dur}`) + `<main><div class="list">${items.map(comboCard).join("")}</div></main>`;
  document.getElementById("back").onclick = home;
  bindCombos(()=>listByKind(k));
  window.scrollTo(0,0);
}
function listByCat(cat){
  stopTimer();
  const items = COMBOS.filter(c=>c.k!=="mes" && c.c.split(" ").includes(cat));
  items.sort((a,b)=>total(a)-total(b));
  app.innerHTML = bar(CATS[cat]) + `<main><div class="list">${items.map(comboCard).join("")}</div></main>`;
  document.getElementById("back").onclick = home;
  bindCombos(()=>listByCat(cat));
  window.scrollTo(0,0);
}

function intro(c, back){
  stopTimer();
  app.innerHTML = bar(c.t) + `<main>
    <div class="combo" style="cursor:default">
      <span class="k"><span class="pill ${KIND[c.k][2]}">${KIND[c.k][0]} · ${mins(c)}</span></span>
      <span class="t">${c.t}</span>
      <span class="s">${c.s.length} ${c.s.length===1?"exercício":"exercícios"} · ${fmt(total(c))}</span>
    </div>
    <ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px">${c.s.map(x=>`<li><strong>${EX[x[0]].n}</strong> <span style="color:var(--muted)">· ${fmt(x[1])}</span></li>`).join("")}</ol>
    <div class="note"><strong>Antes de começar:</strong> movimento leve, sem dor. Se doer, diminua ou pare. Máquina parada antes de começar.</div>
    <button class="btn sun" id="start">Começar</button>
  </main>`;
  document.getElementById("back").onclick = back;
  document.getElementById("start").onclick = () => play(c, 0, back);
  window.scrollTo(0,0);
}

function play(c, i, back){
  stopTimer();
  const [id, secs] = c.s[i];
  const e = EX[id];
  let left = secs, running = true;
  const done = c.s.slice(0,i).reduce((a,x)=>a+x[1],0);
  app.innerHTML = bar(c.t) + `<div class="player">
    <div class="stepinfo"><span>Exercício ${i+1} de ${c.s.length}</span><span>${KIND[c.k][0]}</span></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="video">
      <video id="vid" src="v/${id}.mp4" poster="v/${id}.jpg" autoplay muted loop playsinline preload="auto" aria-label="Vídeo: ${e.n}"></video>
    </div>
    <h2 class="exname">${e.n}</h2>
    <p class="how">${e.how}</p>
    <div class="dose">${e.dose}</div>
    <div class="timer"><div class="clock" id="clock" aria-live="polite">${fmt(left)}</div></div>
    <div class="ctrl">
      <button class="btn soft" id="prev" ${i===0?"disabled style='opacity:.4'":""}>Anterior</button>
      <button class="btn main" id="pause">Pausar</button>
      <button class="btn soft" id="next">${i===c.s.length-1?"Concluir":"Próximo"}</button>
    </div>
  </div>`;
  const clock = document.getElementById("clock"), prog = document.getElementById("prog"), pb = document.getElementById("pause");
  const T = total(c);
  const paint = () => { clock.textContent = fmt(left); prog.style.width = ((done + secs - left)/T*100) + "%"; };
  paint();
  const next = () => i < c.s.length-1 ? play(c, i+1, back) : finish(c, back);
  timer = setInterval(()=>{ if(!running) return; left--; paint(); if(left<=0){ next(); } }, 1000);
  const vid = document.getElementById("vid");
  pb.onclick = () => { running = !running; pb.textContent = running ? "Pausar" : "Continuar"; try{ running ? vid.play() : vid.pause(); }catch(err){} };
  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = () => { if(i>0) play(c, i-1, back); };
  document.getElementById("back").onclick = () => { stopTimer(); back(); };
  window.scrollTo(0,0);
}

function finish(c, back){
  stopTimer();
  addPause();
  const n = weekCount();
  app.innerHTML = `<div class="done">
    ${LOGO(88)}
    <h2>Pausa concluída!</h2>
    <p>Você fez o ${KIND[c.k][0]} <strong>${c.t}</strong>. ${n ? `São ${n} ${n===1?"pausa":"pausas"} nos últimos 7 dias.` : ""}</p>
    <p class="anchor" style="color:var(--ink)">Cuidar de você <em style="color:var(--sun-text)">faz parte do trabalho.</em></p>
    <button class="btn sun" id="home" style="max-width:320px">Voltar ao início</button>
  </div>`;
  document.getElementById("home").onclick = home;
}

function library(){
  stopTimer();
  const ids = Object.keys(EX);
  app.innerHTML = bar("Todos os exercícios") + `<main>
    <label for="q" class="hidden">Buscar exercício</label>
    <input id="q" class="search" type="search" placeholder="Buscar: ombro, punho, respiração…">
    <div class="lib" id="libl"></div></main>`;
  const render = q => {
    q = (q||"").toLowerCase();
    document.getElementById("libl").innerHTML = ids.filter(id=>{
      const e = EX[id]; return !q || (e.n+" "+e.r+" "+e.how).toLowerCase().includes(q);
    }).map(id=>{const e=EX[id]; return `<div class="libitem"><img src="v/${id}.jpg" alt="" loading="lazy"><div><div class="t">${e.n}</div><div class="s">${e.r} · ${e.dose}</div><p>${e.how}</p></div></div>`}).join("") || `<p>Nenhum exercício encontrado. Tente outra palavra.</p>`;
  };
  render("");
  document.getElementById("q").oninput = ev => render(ev.target.value);
  document.getElementById("back").onclick = home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
