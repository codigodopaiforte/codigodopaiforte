<style>
:root{
  /* Break Leve · Sol & Menta. Layout: coluna única de celular, cartões grandes para o polegar */
  --ink:#13293D; --ink-2:#1C3A55; --cream:#FFF8EC; --sun:#FFB020; --sun-soft:#FFC95C; --sun-text:#A86400; --mint:#3DD9A0; --line:#EADFC9; --muted:#5A6B7A;
  --f-brand:'Space Grotesk', 'Segoe UI', sans-serif; --f-display:'Nunito', 'Segoe UI', sans-serif; --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{background:var(--ink);color:var(--cream);padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-brand);font-size:26px;letter-spacing:-.5px;line-height:1}
.brand b{font-weight:700}.brand span{color:var(--sun-soft)}
.company{font-size:13px;color:#B8C7D6;text-align:right;line-height:1.3}
.company strong{display:block;color:var(--cream);font-weight:600;font-size:14px}
.anchor{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.anchor em{font-style:normal;color:var(--sun-soft)}
.streak{display:flex;align-items:center;gap:8px;font-size:13px;color:#DCE6EF}
.streak .dot{width:8px;height:8px;border-radius:4px;background:var(--mint)}
main{flex:1;padding:20px 16px 32px;display:flex;flex-direction:column;gap:26px}
h2.sec{font-family:var(--f-brand);font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-.2px}
.month{background:var(--sun);color:var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:none;text-align:left;width:100%}
.month small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.month .t{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.05}
.month .d{font-size:14px}
.month .go{align-self:flex-start;background:var(--ink);color:var(--cream);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.time{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:96px;border-top:6px solid var(--mint)}
.time:nth-child(2){border-top-color:var(--sun)}.time:nth-child(3){border-top-color:var(--ink)}
.time .n{font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.1}
.time .m{font-family:var(--f-brand);font-weight:700;color:var(--sun-text);font-size:15px}
.feels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:600;font-size:15px;line-height:1.25;min-height:64px}
.feel svg{flex:none}
.libbtn{width:100%;background:transparent;border:2px dashed var(--line);border-radius:16px;padding:14px;font-weight:600;color:var(--muted)}
footer.foot{padding:18px 16px 28px;text-align:center;font-size:12px;color:var(--muted)}
/* telas internas */
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);color:var(--cream)}
.back{background:transparent;border:none;color:var(--cream);font-size:15px;font-weight:600;padding:8px 4px;display:flex;align-items:center;gap:6px}
.bar .ttl{font-family:var(--f-brand);font-weight:700;font-size:17px}
.list{display:flex;flex-direction:column;gap:12px}
.combo{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.combo .k{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.pill{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.p-respiro{background:#D7F7EA;color:#11634A}.p-ajuste{background:#FFE9BF;color:#7A4A00}.p-recarga{background:#DCE4EE;color:var(--ink)}.p-mes{background:var(--sun);color:var(--ink)}
.combo .t{font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.15}
.combo .s{font-size:14px;color:var(--muted)}
.note{background:#fff;border-left:4px solid var(--sun);border-radius:10px;padding:12px 14px;font-size:14px}
/* player */
.player{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 16px 24px}
.stepinfo{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.video{height:min(44vh,440px);background:var(--ink);border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.video video{height:100%;width:100%;object-fit:contain;display:block}
.libitem{display:flex;gap:12px;align-items:flex-start}
.libitem img{width:56px;height:100px;object-fit:cover;border-radius:10px;flex:0 0 56px;background:var(--line)}
.video .tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.12);color:var(--cream);border-radius:999px;padding:4px 10px;font-size:12px}
.figure{animation:stretch 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes stretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
@media (prefers-reduced-motion: reduce){.figure{animation:none}.progress i{transition:none}}
.exname{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.how{margin:0;font-size:16px}
.dose{font-size:14px;font-weight:600;color:var(--sun-text)}
.timer{display:flex;align-items:center;justify-content:center;gap:18px}
.clock{font-family:var(--f-brand);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.btn{border:none;border-radius:16px;padding:16px 10px;font-weight:600;font-size:16px;min-height:56px}
.btn.main{background:var(--ink);color:var(--cream)}
.btn.soft{background:#fff;border:1px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);width:100%}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px 20px}
.done h2{font-family:var(--f-display);font-weight:900;font-size:30px;margin:0;line-height:1.1}
.done p{margin:0;max-width:32ch}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;background:#fff}
.lib{display:flex;flex-direction:column;gap:8px}
.libitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.libitem .t{font-weight:600}.libitem .s{font-size:13px;color:var(--muted)}
.libitem p{margin:6px 0 0;font-size:14px}
.hidden{display:none !important}
/* ===== Liga Break Leve ===== */
main.withtabs{padding-bottom:96px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px}
.tabs button.on{color:var(--ink)}.tabs button.on svg{color:var(--sun-text)}
.liga{display:flex;gap:16px;align-items:center;background:var(--ink-2);border:none;border-radius:20px;padding:14px;color:var(--cream);text-align:left;width:100%}
.ringwrap{position:relative;display:grid;place-items:center}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ringtxt b{font-family:var(--f-brand);font-size:24px}.ringtxt span{font-size:11px;color:#B8C7D6;margin-top:3px}
.ringwrap.big .ringtxt b{font-size:40px;color:var(--ink)}.ringwrap.big .ringtxt span{color:var(--muted);font-size:13px}
.ringwrap.big circle:first-child{stroke:var(--line)}
.ringp{transition:stroke-dashoffset 1s ease}
.ligainfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.hi{display:flex;align-items:center;gap:8px;font-size:15px}
.lv{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--sun-soft);line-height:1.1}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#DCE6EF}.stats b{color:#fff;font-size:14px}
.avpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avpick button{background:#fff;border:3px solid transparent;border-radius:50%;padding:3px;display:grid;place-items:center;aspect-ratio:1}
.avpick button.on{border-color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px}
.chips button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-size:15px}.check input{width:20px;height:20px;accent-color:var(--ink)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:600;font-size:15px;width:100%}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:12px 16px;border-radius:14px;font-size:14px;max-width:340px;opacity:0;transition:.3s;z-index:9;text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.prize{display:flex;gap:12px;align-items:flex-start;background:var(--sun);border-radius:18px;padding:14px}
.prize b{display:block;font-family:var(--f-display);font-weight:900;font-size:18px}.prize span{font-size:13.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:none;background:none;border-radius:10px;padding:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--cream)}
.srow,.prow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.srow.mine,.prow.mine{border:2px solid var(--sun);background:#FFFBF2}
.pos{font-family:var(--f-brand);font-weight:700;font-size:18px;min-width:30px;text-align:center}
.sbody,.pbody{flex:1;min-width:0}
.sname,.pname{font-weight:600;font-size:15.5px}
.smeta{font-size:12.5px;color:var(--muted)}
.sbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}.sbar.big{height:12px;margin-top:10px}
.sbar i{display:block;height:100%;background:var(--mint);border-radius:5px}
.ppts{text-align:right;line-height:1}.ppts b{font-family:var(--f-brand);font-size:22px;display:block}.ppts span{font-size:11px;color:var(--muted)}
.rules{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.rules summary{font-weight:600;cursor:pointer}.rules ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.me{display:flex;gap:14px;align-items:center}
.mename{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.1}
.lvl{display:inline-block;margin-top:6px;background:var(--ink);color:var(--sun-soft);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:12px}
.week>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wcol{height:90px;width:100%;max-width:34px;background:var(--cream);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wcol i{display:block;width:100%;background:var(--mint);border-radius:8px}
.week small{font-weight:600;color:var(--ink);min-height:14px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.badge b{font-size:14px}.badge span{font-size:12px;color:var(--muted)}
.badge.off{opacity:.42;filter:grayscale(1)}
.card .row .smeta{white-space:nowrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpis b{font-family:var(--f-brand);font-size:26px;line-height:1}.kpis span{font-size:12.5px;color:var(--muted)}
.climb{display:flex;gap:10px;width:100%;max-width:340px}
.climb div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center}
.climb b{font-family:var(--f-brand);font-size:22px}.climb span{font-size:12px;color:var(--muted)}.climb em{font-style:normal;color:#11634A;font-weight:700}
.newbadge{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--cream);border-radius:16px;padding:10px 16px;text-align:left;animation:pop .5s ease}
.newbadge small{display:block;color:var(--sun-soft);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.skip{background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){.ringp,.toast{transition:none}.newbadge{animation:none}}
</style>

<body>
<div class="app" id="app"></div>

<script>
// Nome da empresa vem do link: /breakleve/?empresa=Nome%20da%20Empresa
const EMPRESA = (()=>{ try{ const n=new URLSearchParams(location.search).get("empresa"); return n ? n.replace(/[<>&"]/g,"").slice(0,40) : "Confecção Exemplo"; }catch(e){ return "Confecção Exemplo"; } })();
const MES = { nome: "Novembro", tema: "Força que protege", desc: "Fortalecimento geral para proteger costas, ombros e joelhos.", combo: "mes-ajuste" };

const CATS = {
  pescoco: "Pescoço e ombros", costas: "Costas e postura", punhos: "Punhos e mãos",
  pernas: "Pernas e joelhos", estresse: "Estresse e tensão", cansaco: "Cansaço e sono"
};

const EX = {
  elevacao:{n:"Elevação lateral dos braços",r:"Pescoço e ombros",how:"Em pé, braços um pouco à frente do corpo. Suba até a altura dos ombros e desça devagar.",dose:"Uma série até cansar leve"},
  w:{n:"Abertura em W",r:"Pescoço e ombros",how:"Braços em W ao lado do corpo. Aperte as escápulas uma na outra e segure.",dose:"10 x 5 segundos"},
  queixo:{n:"Recolher o queixo",r:"Pescoço e ombros",how:"Olhando para frente, puxe o queixo para trás, como uma papada, sem baixar a cabeça.",dose:"10 x 3 segundos"},
  rolar:{n:"Rolar os ombros",r:"Pescoço e ombros",how:"Suba os ombros até as orelhas, leve para trás e solte.",dose:"10 vezes"},
  orelha:{n:"Orelha no ombro",r:"Pescoço e ombros",how:"Incline a cabeça para o lado. A mão do outro lado desce em direção ao chão. Troque de lado na metade.",dose:"20 a 30 segundos cada lado"},
  axila:{n:"Olhar para a axila",r:"Pescoço e ombros",how:"Gire a cabeça um pouco e olhe para baixo, em direção à axila. A mão apoia de leve na nuca. Troque de lado na metade.",dose:"20 a 30 segundos cada lado"},
  peito:{n:"Peito na parede",r:"Pescoço e ombros",how:"Antebraço apoiado na parede ou no batente. Gire o corpo para o lado oposto. Troque de lado na metade.",dose:"20 a 30 segundos cada lado"},
  extensao:{n:"Extensão em pé",r:"Costas",how:"Mãos na lombar. Leve o quadril para frente e o peito para cima, olhando um pouco para o alto.",dose:"5 a 10 x 2 segundos"},
  gato:{n:"Gato e vaca sentado",r:"Costas",how:"Mãos nos joelhos. Arredonde as costas soltando o ar, depois abra o peito puxando o ar.",dose:"8 vezes"},
  rotacao:{n:"Rotação do tronco",r:"Costas",how:"Braços cruzados no peito. Gire para um lado e para o outro sem mexer o quadril.",dose:"8 vezes cada lado"},
  inclinacao:{n:"Inclinação lateral",r:"Costas",how:"Em pé, um braço para cima. Incline o tronco para o lado oposto. Troque de lado na metade.",dose:"20 a 30 segundos cada lado"},
  abdomen:{n:"Ativação do abdômen",r:"Costas",how:"Puxe o umbigo para dentro e segure, respirando normalmente.",dose:"5 x 10 segundos"},
  cadeira:{n:"Agachamento na cadeira",r:"Costas e pernas",how:"Sente e levante da cadeira sem usar as mãos, devagar, com a coluna reta.",dose:"10 vezes"},
  cadeirinha:{n:"Cadeirinha na parede",r:"Costas e pernas",how:"Costas encostadas na parede. Deslize até os joelhos dobrarem um pouco e segure.",dose:"3 x 20 segundos"},
  tendoes:{n:"Deslizamento dos tendões",r:"Punhos e mãos",how:"Mão aberta, gancho, punho fechado, mão reta e aberta de novo. Segure 3 segundos em cada posição.",dose:"5 ciclos"},
  abrirmao:{n:"Abrir e fechar a mão",r:"Punhos e mãos",how:"Feche bem a mão e abra esticando os dedos ao máximo.",dose:"10 vezes"},
  flexores:{n:"Alongar os flexores",r:"Punhos e mãos",how:"Braço esticado, palma para frente. A outra mão puxa os dedos para trás. Troque de mão na metade.",dose:"20 a 30 segundos cada mão"},
  extensores:{n:"Alongar os extensores",r:"Punhos e mãos",how:"Braço esticado, palma para baixo. A outra mão dobra o punho para baixo. Troque de mão na metade.",dose:"20 a 30 segundos cada mão"},
  giro:{n:"Giro de punhos",r:"Punhos e mãos",how:"Mãos soltas. Desenhe círculos com os punhos para os dois lados.",dose:"10 vezes cada lado"},
  polegar:{n:"Polegar ao dedo",r:"Punhos e mãos",how:"Toque a ponta do polegar em cada dedo, ida e volta.",dose:"3 vezes"},

function weekStart(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
const dayKey = t => { const d=new Date(t); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); };
function myWeek(log){
  log = log || S.log;
  const ws = weekStart(), per = {};
  log.filter(e=>e.t>=ws).forEach(e=>{ const k=dayKey(e.t); per[k]=(per[k]||0)+e.min; });
  const days = Object.keys(per).length;
  const counted = Object.values(per).reduce((a,m)=>a+Math.min(m,CAP_DIA),0);
  return {per, days, min:counted, pts: counted + (days>=3?BONUS_3D:0)};
}
const totalMin = () => S.prevMin + S.log.reduce((a,e)=>a+e.min,0);
function nivel(m){
  let i=0; NIVEIS.forEach((n,j)=>{ if(m>=n[0]) i=j; });
  const next = NIVEIS[i+1];
  return {n:i+1, nome:NIVEIS[i][1], prox: next ? next[0] : null, base:NIVEIS[i][0], proxNome: next ? next[1] : null};
}
function players(log){
  const list = GENTE.map(p=>({...p}));
  if(S.me && S.show) list.push({nick:S.me.nick, s:S.me.s, pts:myWeek(log).pts, av:S.me.av, me:true});
  return list.sort((a,b)=>b.pts-a.pts);
}
function myRank(log){ const l=players(log); const i=l.findIndex(p=>p.me); return i<0?null:i+1; }
function setores(log){
  const all = GENTE.map(p=>({...p}));

}

  document.querySelectorAll(".avpick button").forEach(b=>b.onclick=()=>{ pick=+b.dataset.i; document.querySelectorAll(".avpick button").forEach(x=>x.classList.toggle("on",x===b)); });
  document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{ setor=b.dataset.s; document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("on",x===b)); check(); });
  nick.oninput = check;
  const enter = (google) => {
    const n = nick.value.trim() || "Você";
    S.me = {nick:n.replace(/[<>&"]/g,""), s:setor||"Costura", av:ESCOLHAS[pick]};
    S.show = document.getElementById("show").checked; S.google = !!google;
    // histórico de exemplo desta semana, para a Liga já ter vida
    const ws = weekStart(), now = Date.now();
    [[ws+10*36e5,5,"a-pescoco","ajuste","pescoco"],[ws+(24+15)*36e5,1,"r-punhos","respiro","punhos"]].forEach(([t,m,c,k,cat])=>{ if(t<now-36e5) S.log.push({t,min:m,c,k,cat}); });
    save(); home(); if(google) toast("Demonstração: na versão final, aqui abre o login do Google.");
  };
  go.onclick = () => enter(false);
  document.getElementById("google").onclick = () => { if(!setor||nick.value.trim().length<2){ toast("Escolha apelido e setor primeiro."); return; } enter(true); };
  window.scrollTo(0,0);
}

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.classList.add("in"),20); setTimeout(()=>{t.classList.remove("in"); setTimeout(()=>t.remove(),300)},3200);
}

      <div class="ligainfo">

  document.getElementById("ligacard").onclick = liga;

  document.querySelectorAll(".time").forEach(b=>b.onclick=()=>listByKind(b.dataset.k));
  document.querySelectorAll(".feel").forEach(b=>b.onclick=()=>listByCat(b.dataset.c));

/* ---------- Liga: ranking por setor e geral ---------- */

  app.innerHTML = `<div class="bar"><span class="ttl" style="padding:8px 4px">Liga Break Leve · ${MES.nome}</span></div>
  <main class="withtabs">
    <div class="prize">${MEDAL}<div><b>Prêmios do mês</b><span>${PREMIO.setor}.<br>${PREMIO.sorteio}.</span></div></div>
    <div class="seg"><button data-t="setores" class="${ligaTab==="setores"?"on":""}">Copa dos Setores</button><button data-t="geral" class="${ligaTab==="geral"?"on":""}">Ranking geral</button></div>
    ${ligaTab==="setores" ? `
      <div class="list">${sets.map((x,i)=>`
        <div class="srow ${x.mine?"mine":""}">

          <div class="sbody"><div class="sname">${x.s}${x.mine?` <span class="pill p-mes">seu setor</span>`:""}</div>

            <div class="smeta">${x.avg} pts por pessoa · ${x.ades}% do setor participando</div></div>
        </div>`).join("")}</div>
      <p class="fine">A Copa usa a média de pontos por pessoa, para setor pequeno competir de igual com setor grande.</p>`
    : `
      <div class="list">${ps.map((p,i)=>`
        <div class="prow ${p.me?"mine":""}">
          <div class="pos">${i<3?["🥇","🥈","🥉"][i]:(i+1)+"º"}</div>
          ${avatar(p.av,44)}
          <div class="pbody"><div class="pname">${p.nick}${p.me?" (você)":""}</div><div class="smeta">${p.s}</div></div>
          <div class="ppts"><b>${p.pts}</b><span>pts</span></div>
        </div>`).join("")}</div>
      ${S.show?"":`<p class="fine">Você escolheu não aparecer no ranking geral. Seus pontos continuam valendo para o seu setor.</p>`}`}
    <details class="rules"><summary>Como funciona a pontuação</summary>
      <ul><li><b>1 ponto por minuto</b> de pausa concluída.</li>
      <li><b>Teto de ${CAP_DIA} pontos por dia.</b> Mais que isso não conta: descanso também faz parte.</li>
      <li><b>+${BONUS_3D} pontos</b> de bônus para quem faz pausa em 3 dias da semana.</li>
      <li>Bateu a <b>meta de ${META_SEM} min</b> na semana? Você entra no sorteio.</li>
      <li>O ranking zera toda segunda. Seu nível e suas conquistas ficam para sempre.</li></ul></details>
    <button class="libbtn" id="rh">Ver painel do RH (demonstração)</button>
  </main>${tabs("liga")}`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ ligaTab=b.dataset.t; liga(); });
  document.getElementById("rh").onclick = rh;
  bindTabs(); window.scrollTo(0,0);
}

/* ---------- Eu: nível, semana, conquistas ---------- */
function perfil(){
  stopTimer();
  if(!S.me) return onboarding();
  const w = myWeek(), tm = totalMin(), nv = nivel(tm), got = earned();
  const ws = weekStart(), dias = ["Seg","Ter","Qua","Qui","Sex"];
  const vals = dias.map((d,i)=>{ const k=dayKey(ws+i*864e5+12*36e5); return Math.min(w.per[k]||0, CAP_DIA); });
  const pct = nv.prox ? Math.round((tm-nv.base)/(nv.prox-nv.base)*100) : 100;
  app.innerHTML = `<div class="bar"><span class="ttl" style="padding:8px 4px">Meu progresso</span></div>
  <main class="withtabs">
    <div class="me">${avatar(S.me.av,76)}<div><div class="mename">${S.me.nick}</div><div class="smeta">${S.me.s} · ${EMPRESA}</div>
      <div class="lvl">Nível ${nv.n} · ${nv.nome}</div></div></div>
    <div class="card"><div class="row"><b>${tm} minutos de cuidado</b><span class="smeta">${nv.prox?`faltam ${nv.prox-tm} para ${nv.proxNome}`:"nível máximo"}</span></div>
      <div class="sbar big"><i style="width:${pct}%"></i></div></div>
    <div class="card"><div class="row"><b>Esta semana</b><span class="smeta">${w.pts} pts · sequência de ${S.streak+(w.days?1:0)} semanas</span></div>
      <div class="week">${dias.map((d,i)=>`<div><div class="wcol"><i style="height:${Math.max(vals[i]/CAP_DIA*100, vals[i]?8:0)}%"></i></div><span>${d}</span><small>${vals[i]||""}</small></div>`).join("")}</div></div>
    <section><h2 class="sec">Conquistas · ${got.length} de ${CONQ.length}</h2>
      <div class="badges">${CONQ.map(c=>`<div class="badge ${got.includes(c[0])?"":"off"}">${MEDAL}<b>${c[1]}</b><span>${c[2]}</span></div>`).join("")}</div></section>
    ${S.google ? `<p class="fine" style="text-align:center">Progresso salvo na sua conta Google.</p>` : `<button class="gbtn" id="google">Salvar meu progresso com Google</button>`}
    <label class="check"><input type="checkbox" id="show" ${S.show?"checked":""}> Aparecer no ranking geral</label>
    <button class="libbtn" id="reset">Recomeçar a demonstração</button>
  </main>${tabs("eu")}`;
  const g = document.getElementById("google"); if(g) g.onclick = () => { S.google = true; save(); toast("Demonstração: na versão final, aqui abre o login do Google."); perfil(); };
  document.getElementById("show").onchange = e => { S.show = e.target.checked; save(); };
  document.getElementById("reset").onclick = () => { S = null; try{localStorage.removeItem("bl_liga")}catch(e){} load(); onboarding(); };
  bindTabs(); window.scrollTo(0,0);
}

/* ---------- listas, introdução e player (como antes) ---------- */
function bar(title){
  return `<div class="bar"><button class="back" id="back" aria-label="Voltar">‹ Voltar</button><span class="ttl">${title}</span></div>`;
}
function comboCard(c){
  const [k,,cls] = KIND[c.k];
  return `<button class="combo" data-id="${c.id}">
    <span class="k"><span class="pill ${cls}">${k} · ${mins(c)}</span>${c.c && CATS[c.c] ? CATS[c.c] : ""}</span>
    <span class="t">${c.t}</span>
    <span class="s">${c.s.map(x=>EX[x[0]].n).join(" · ")}</span>
  </button>`;
}
function bindCombos(back){ document.querySelectorAll(".combo").forEach(b=>b.onclick=()=>intro(COMBOS.find(c=>c.id===b.dataset.id), back)); }
function listByKind(k){
  stopTimer();
  const items = COMBOS.filter(c=>c.k===k), [name,dur] = KIND[k];
  app.innerHTML = bar(`${name} · ${dur}`) + `<main><div class="list">${items.map(comboCard).join("")}</div></main>`;
  document.getElementById("back").onclick = home; bindCombos(()=>listByKind(k)); window.scrollTo(0,0);
}
function listByCat(cat){
  stopTimer();
  const items = COMBOS.filter(c=>c.k!=="mes" && c.c.split(" ").includes(cat)).sort((a,b)=>total(a)-total(b));
  app.innerHTML = bar(CATS[cat]) + `<main><div class="list">${items.map(comboCard).join("")}</div></main>`;
  document.getElementById("back").onclick = home; bindCombos(()=>listByCat(cat)); window.scrollTo(0,0);
}
const ptsOf = c => Math.max(1, Math.round(total(c)/60));
function intro(c, back){
  stopTimer();
  app.innerHTML = bar(c.t) + `<main>
    <div class="combo" style="cursor:default">
      <span class="k"><span class="pill ${KIND[c.k][2]}">${KIND[c.k][0]} · ${mins(c)}</span><span class="pill p-respiro">+${ptsOf(c)} ${ptsOf(c)===1?"ponto":"pontos"}</span></span>
      <span class="t">${c.t}</span>
      <span class="s">${c.s.length} ${c.s.length===1?"exercício":"exercícios"} · ${fmt(total(c))}</span>
    </div>
    <ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px">${c.s.map(x=>`<li><strong>${EX[x[0]].n}</strong> <span style="color:var(--muted)">· ${fmt(x[1])}</span></li>`).join("")}</ol>
    <div class="note"><strong>Antes de começar:</strong> movimento leve, sem dor. Se doer, diminua ou pare. Máquina parada antes de começar.</div>
    <button class="btn sun" id="start">Começar</button>
  </main>`;
  document.getElementById("back").onclick = back;
  document.getElementById("start").onclick = () => play(c, 0, back);
  window.scrollTo(0,0);
}
function play(c, i, back){
  stopTimer();
  const [id, secs] = c.s[i], e = EX[id];
  let left = secs, running = true;
  const done = c.s.slice(0,i).reduce((a,x)=>a+x[1],0);
  app.innerHTML = bar(c.t) + `<div class="player">
    <div class="stepinfo"><span>Exercício ${i+1} de ${c.s.length}</span><span>${KIND[c.k][0]} · +${ptsOf(c)} pts</span></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="video"><video id="vid" src="../v/${id}.mp4" poster="../v/${id}.jpg" autoplay muted loop playsinline preload="auto" aria-label="Vídeo: ${e.n}"></video></div>
    <h2 class="exname">${e.n}</h2>
    <p class="how">${e.how}</p>
    <div class="dose">${e.dose}</div>
    <div class="timer"><div class="clock" id="clock" aria-live="polite">${fmt(left)}</div></div>
    <div class="ctrl">
      <button class="btn soft" id="prev" ${i===0?"disabled style='opacity:.4'":""}>Anterior</button>
      <button class="btn main" id="pause">Pausar</button>
      <button class="btn soft" id="next">${i===c.s.length-1?"Concluir":"Próximo"}</button>
    </div>
    <button class="skip" id="skip">⏩ Demonstração: concluir a pausa agora</button>
  </div>`;
  const clock = document.getElementById("clock"), prog = document.getElementById("prog"), pb = document.getElementById("pause"), T = total(c);
  const paint = () => { clock.textContent = fmt(left); prog.style.width = ((done + secs - left)/T*100) + "%"; };
  paint();
  const next = () => i < c.s.length-1 ? play(c, i+1, back) : finish(c, back);
  timer = setInterval(()=>{ if(!running) return; left--; paint(); if(left<=0){ next(); } }, 1000);
  const vid = document.getElementById("vid");
  pb.onclick = () => { running = !running; pb.textContent = running ? "Pausar" : "Continuar"; try{ running ? vid.play() : vid.pause(); }catch(err){} };
  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = () => { if(i>0) play(c, i-1, back); };
  document.getElementById("skip").onclick = () => finish(c, back);
  document.getElementById("back").onclick = () => { stopTimer(); back(); };
  window.scrollTo(0,0);
}

/* ---------- pausa concluída: pontos, ranking e conquistas ---------- */
function finish(c, back){
  stopTimer();
  const before = myWeek(), rkBefore = myRank(), stBefore = setores().findIndex(x=>x.mine)+1, gotBefore = earned();
  const m = ptsOf(c), today = before.per[dayKey(Date.now())]||0;
  const credited = Math.max(0, Math.min(m, CAP_DIA - today));
  S.log.push({t:Date.now(), min:m, c:c.id, k:c.k, cat:c.c}); save();
  const after = myWeek(), rk = myRank(), st = setores().findIndex(x=>x.mine)+1;
  const gained = after.pts - before.pts, novas = CONQ.filter(x=>x[3]() && !gotBefore.includes(x[0]));
  const subiu = rkBefore && rk && rk < rkBefore;
  app.innerHTML = `<div class="done">
    <div class="ringwrap big">${ring(after.min, META_SEM, 150, 14)}<div class="ringtxt"><b>+${gained}</b><span>${gained===1?"ponto":"pontos"}</span></div></div>
    <h2>Pausa concluída!</h2>
    <p>${after.min>=META_SEM && before.min<META_SEM ? "<strong>Meta da semana batida!</strong> Você está no sorteio." : `${Math.min(after.min,META_SEM)} de ${META_SEM} minutos da meta da semana.`}
      ${after.days>=3 && before.days<3 ? `<br><strong>+${BONUS_3D} de bônus</strong> por 3 dias de pausa!` : ""}</p>
    ${credited<m ? `<p class="fine">Você chegou ao teto de ${CAP_DIA} pontos hoje. A pausa valeu para o corpo; os pontos voltam amanhã.</p>`:""}
    <div class="climb">
      ${rk ? `<div><b>#${rk}</b><span>geral ${subiu?`<em>▲ ${rkBefore-rk}</em>`:""}</span></div>` : ""}
      <div><b>#${st}</b><span>${S.me.s} ${st<stBefore?`<em>▲ ${stBefore-st}</em>`:""}</span></div>
      <div><b>${after.pts}</b><span>pts na semana</span></div>
    </div>
    ${novas.map(n=>`<div class="newbadge">${MEDAL}<div><small>Nova conquista</small><b>${n[1]}</b></div></div>`).join("")}
    <p class="anchor" style="color:var(--ink);font-size:19px">Cuidar de você <em style="color:var(--sun-text)">faz parte do trabalho.</em></p>
    <div style="display:flex;gap:10px;width:100%;max-width:340px"><button class="btn soft" id="seeliga" style="flex:1">Ver a Liga</button><button class="btn sun" id="home" style="flex:1">Início</button></div>
  </div>`;
  document.getElementById("home").onclick = home;
  document.getElementById("seeliga").onclick = () => { ligaTab = "geral"; liga(); };
}

function library(){
  stopTimer();
  const ids = Object.keys(EX);
  app.innerHTML = bar("Todos os exercícios") + `<main>
    <label for="q" class="hidden">Buscar exercício</label>
    <input id="q" class="search" type="search" placeholder="Buscar: ombro, punho, respiração…">
    <div class="lib" id="libl"></div></main>`;
  const render = q => {
    q = (q||"").toLowerCase();
    document.getElementById("libl").innerHTML = ids.filter(id=>{
      const e = EX[id]; return !q || (e.n+" "+e.r+" "+e.how).toLowerCase().includes(q);
    }).map(id=>{const e=EX[id]; return `<div class="libitem"><img src="../v/${id}.jpg" alt="" loading="lazy"><div><div class="t">${e.n}</div><div class="s">${e.r} · ${e.dose}</div><p>${e.how}</p></div></div>`}).join("") || `<p>Nenhum exercício encontrado. Tente outra palavra.</p>`;
  };
  render("");
  document.getElementById("q").oninput = ev => render(ev.target.value);
  document.getElementById("back").onclick = home;
  window.scrollTo(0,0);
}

home();
</script>
